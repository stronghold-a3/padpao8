<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Member dashboard · PADPAO Eastern Visayas</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2a6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="members">
<a class="skip" href="#main">Skip to content</a>
<div class="strip"></div>

<header class="site-header">
  <div class="nav">
    <a href="index.html" class="brand" aria-label="PADPAO Eastern Visayas home">
      <span class="seal"><img src="assets/icons/logo-circle-256.png" alt="" width="44" height="44"></span>
      <span><b>PADPAO EV</b><small>Member portal</small></span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="index.html">Public site</a>
      <a href="#meetings" data-tab-link="meetings">Meetings</a>
      <a href="#actions" data-tab-link="actions">Action items</a>
      <a href="#profile" data-tab-link="profile">Profile</a>
    </nav>
    <div class="nav-actions">
      <a class="user-chip" href="#profile" data-tab-link="profile" data-tip="Your profile"><span class="av" data-user-initials></span><span data-user-name></span></a>
      <button class="btn btn-outline btn-sm nav-cta authed-only" data-logout><svg class="i i-sm"><use href="#i-logout"/></svg>Log out</button>
      <button class="icon-btn menu-btn" data-drawer-open aria-label="Open menu" aria-expanded="false" aria-controls="drawer"><svg class="i i-lg" aria-hidden="true"><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>

<div class="scrim" aria-hidden="true"></div>
<aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
  <div class="drawer-head">
    <a href="index.html" class="brand"><span class="seal"><img src="assets/icons/logo-circle-256.png" alt="" width="36" height="36"></span><span><b>PADPAO EV</b><small>Member portal</small></span></a>
    <button class="icon-btn" data-drawer-close aria-label="Close menu"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <nav aria-label="Menu">
    <a href="#meetings" data-tab-link="meetings"><svg class="i"><use href="#i-calendar"/></svg>Meetings &amp; minutes</a>
    <a href="#actions" data-tab-link="actions"><svg class="i"><use href="#i-check"/></svg>Action items</a>
    <a href="#profile" data-tab-link="profile"><svg class="i"><use href="#i-user"/></svg>My profile</a>
    <a href="index.html"><svg class="i"><use href="#i-home"/></svg>Public site</a>
  </nav>
  <div class="drawer-foot">
    <button class="btn btn-outline btn-block" data-install><svg class="i"><use href="#i-phoneapp"/></svg>Install app</button>
    <button class="btn btn-navy btn-block" data-logout><svg class="i"><use href="#i-logout"/></svg>Log out</button>
  </div>
</aside>

<main id="main">
  <!-- Shown until access is verified. No member content is in this file. -->
  <div class="gate" id="gate">
    <div>
      <div class="seal" style="width:72px;margin:0 auto 16px"><img src="assets/icons/logo-circle-256.png" alt=""></div>
      <div class="spinner" style="margin:0 auto 12px;color:var(--navy)"></div>
      <p class="muted">Checking your membership…</p>
    </div>
  </div>
  <div id="app" hidden></div>
</main>

<nav class="bottom-nav" aria-label="Quick navigation">
  <a href="index.html"><svg class="i"><use href="#i-home"/></svg>Home</a>
  <a href="#meetings" data-tab-link="meetings" class="active"><svg class="i"><use href="#i-calendar"/></svg>Meetings</a>
  <a href="#actions" data-tab-link="actions"><svg class="i"><use href="#i-check"/></svg>Actions</a>
  <a href="#profile" data-tab-link="profile"><svg class="i"><use href="#i-user"/></svg>Profile</a>
</nav>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/members.js"></script>
</body>
</html>
